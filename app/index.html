<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Leonida Legend: a fully offline guide and progress tracker for the official 55 Grand Theft Auto VI trophies, with a cited guide for every trophy.">
<title>Leonida Legend — GTA 6 Trophy Guide &amp; Tracker</title>
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <div>
      <h1>Leonida Legend</h1>
      <p class="sub">GTA 6 Trophy Guide &amp; Tracker — 55 trophies, fully offline</p>
    </div>
    <div class="masthead-tools">
      <button id="btn-export" type="button">Export progress</button>
      <label class="import-label">Import progress <input id="file-import" type="file" accept=".json,application/json" hidden></label>
      <button id="btn-reset" type="button">Reset</button>
    </div>
  </div>
</header>

<section id="audit" aria-label="List audit"></section>

<nav class="views" aria-label="Views">
  <button type="button" data-view="ledger" class="view-btn is-active">Ledger</button>
  <button type="button" data-view="roadmap" class="view-btn">Roadmap</button>
  <button type="button" data-view="missables" class="view-btn">Missables</button>
  <button type="button" data-view="sources" class="view-btn">Sources</button>
  <span id="progress-line" class="progress-line"></span>
</nav>

<main id="view"></main>

<footer class="colophon">
  <p>Leonida Legend works fully offline. Your progress lives only in this browser (localStorage) — export it to move it between devices.</p>
</footer>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/filters.js"></script>
<script src="js/views/ledger.js"></script>
<script src="js/views/roadmap.js"></script>
<script src="js/views/missables.js"></script>
<script src="js/views/sources.js"></script>
<script src="js/main.js"></script>
</body>
</html>
